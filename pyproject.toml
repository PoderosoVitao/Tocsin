[project]
name = "tocsin"
version = "0.1.0"
description = "A job monitor that understands AI jobs: missed runs, failures, and evaluation regressions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# The base install is the job-side CLI and has no dependencies, so wrapping a
# job never pulls in (or breaks on) the server stack.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tocsin"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
