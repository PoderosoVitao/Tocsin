[project]
name = "tocsin"
version = "0.1.0"
description = "A job monitor that understands AI jobs: missed runs, failures, and evaluation regressions."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
# The base install is the job-side CLI and has no dependencies, so wrapping a
# job never pulls in (or breaks on) the server stack.
dependencies = []

[project.optional-dependencies]
server = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "cronsim>=2.6",
    "fastapi>=0.115",
    "httpx>=0.27",
    "prometheus-client>=0.20",
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "redis>=5.0",
    "sqlalchemy[asyncio]>=2.0",
    "taskiq>=0.11",
    "taskiq-redis>=1.0",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
tocsin = "tocsin.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tocsin"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    # Private Postgres and Redis servers for running the tests without Docker.
    # Both only publish wheels up to Python 3.12; on newer versions, point the
    # tests at your own servers with TOCSIN_TEST_DATABASE_URL and
    # TOCSIN_TEST_REDIS_URL, as CI does.
    "pgserver>=0.1.4; python_version < '3.13'",
    "redislite>=6.2; python_version < '3.13'",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["taskiq.TaskiqDepends"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
